<html>

      	<title>The Fall - How far can you fall?</title>

   	<body>	
		<div id="fb-root"></div>
		<script>(function(d, s, id) {
		  var js, fjs = d.getElementsByTagName(s)[0];
		  if (d.getElementById(id)) {return;}
		  js = d.createElement(s); js.id = id;

		<div id="content">
			
			<div id="purchase" class="shadow roundCorners">
				<span id="buy">Buy pack of themes for $1</span>
				<a id="why" href="whyshouldibuy.html">Why?</a>
			</div>

			<div id="start" class="shadow roundCorners">
				START
			</div>
			
			<div id="sharingBox">
				<div id="facebook">
					<div class="fb-like" data-send="false" data-layout="button_count" data-width="450" data-show-faces="false"></div>
				</div>
				
				<div id="twitter">
					<a href="http://twitter.com/share" class="twitter-share-button" data-count="horizontal" data-via="floriaen">Tweet</a><script type="text/javascript" src="http://platform.twitter.com/widgets.js"></script>
				</div>
				
				<script type="text/javascript" src="https://apis.google.com/js/plusone.js"></script>
				<div id="gplus">
					<div class="g-plusone" data-size="medium"></div>
				</div>
				
				<div id="pCount">
					<a id="why" href="whyshouldibuy.html">$7/$99</A>
				</div>
				
				<div id="paypal">
					<form id="paypalForm" action="https://www.paypal.com/cgi-bin/webscr" method="post">
						<input type="hidden" name="cmd" value="_s-xclick">

					</form>
					
				</div>

			</div>
			
			<div id="game">
				<div id="gameScreen">
					<div id="instructions" class="roundCorners shadow">
						<h4>How far can you fall?</h4>
						<p>
							Use arrows to move
							<br />Space for jump
							<br />Holding x if you get stuck
						</p>
					</div>
					<div id="average" class="roundCorners shadow">000 meters</div>
					<div id="howtoplay" href="">How to play?</div>
				</div>
			</div>
			
			
		</div>
		<div id="footer">&copy; floriaen</div>

	<script type="text/javascript" src="scripts/ext/head.js"></script>
	<script type="text/javascript">
		head.js(
			"scripts/ext/prototype.js",
			function() {
				Event.observe(window, 'load', function() {
					
					// 
					new Ajax.Request('/thefall/score.php', {
				    	method: 'get',
						parameters: 'pattern=getAverage',
				    	onSuccess: function(transport) {
				        	var result = transport.responseText;
							if (result) {
								var data = result.evalJSON();
								if (data) {
									var average = (0.5 + parseInt(data.average, 10)) << 0;
									$('average').update('Average: <br />' + average + ' meters');
								}
							}
				    	}
					});
					
					Event.observe($('gameScreen'), 'click', function() {
						$('instructions').setStyle({
							'display': 'none'
						});
					});
					
					Event.observe($('purchase'), 'click', function() {
						$('paypalForm').submit();
						//window.location.href = 'index.html';
					});
					
					Event.observe($('start'), 'click', function() {
						window.location.href = 'game.html';
						//window.location.href = 'index.html';
					});
					
					Event.observe($('howtoplay'), 'click', function(e) {
						$('instructions').setStyle({
							'opacity': 0.8,
							'display': 'block'
						});
						Event.stop(e)
					});
					Event.observe($('instructions'), 'click', function(e) {
						$('instructions').setStyle({
							'display': 'none'
						});
						Event.stop(e)
					});
				});
			}
		);
	</script>
