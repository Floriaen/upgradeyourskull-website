<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN"
   "http://www.w3.org/TR/html4/strict.dtd">

<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>End Scene</title>
	<style type="text/css">
		#cache {
			display: none;
		}
		#canvas {
			border: 1px solid black;
			width:480px; 
			height:575px;
			
			/* 2.5 ratio */
		}
	</style>
</head>
<body>
	<div id="cache">														
	</div>
	
	
	<canvas id="canvas" width="192" height="230"></canvas>
	<script type="text/javascript">
		window.onload = function() {
			var i = 0;
			for (i = 0; i < 72; i++) {
				(function(n) {
					var img = new Image();
					img.id = 'img' + n;
					img.src = n + '.png#' + (new Date()).getTime();
					document.getElementById('cache').appendChild(img);
				})(i);				
			}
			
			i = 0;
			var tic = setInterval(function() {
				if (i < 72) {
					document.getElementById("canvas").getContext('2d').drawImage(
						document.getElementById("img" + i), 0, 0, 58, 47, 0, 86, 192, 160
					);
					i++;
				} else {
					clearInterval(tic);
				}
			}, 1000/5);
			
			
		};
	</script>
	
	
</body>
</html>
