<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN"
   "http://www.w3.org/TR/html4/strict.dtd">

<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Xcode 4 theme</title>
	<style type="text/css">
		html, body {
			background-color: #1f1c1a;
			font-family: Helvetica, Arial, sans-serif;
			font-size: 12px;
			color:white;
		}
		
		a {
			color: lime;
		}
		a:hover {
			text-decoration: none;
		}
		
		#container {
			margin: 10px;
		}
		
		.box {
			margin: 20px 0;
		}
	
		#screen {
			border: 1px solid white;
			width: 627px;
			height: 497px
		}
		
		li {
			list-style: none;
			margin: 5px 0;
		}
	</style>
</head>
<body>
	<div id="container">
		<h2>Xcode 4 theme</h2>
		<p>this is a portage of the TextMate Theme by <a href="http://www.zachstronaut.com/projects/tm-theme/" target="_blank">Zachary Johnson</a></p>
		<div class="box">
			<h3>Instructions:</h3>
			<ul>
				<li>First download the theme <a href="ZCHTM.dvtcolortheme.zip"> here</a></li>
				<li>Then, unzip into the ~/Library/Developer/Xcode/UserData/FontAndColorThemes directory</li>
		</div>
		
		<div class="box">
			<p>Here is a screenshot of the theme in action</p>
			<img id="screen" src="screen.png" />
		</div>
	</div>

</body>
</html>
